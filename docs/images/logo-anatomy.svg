      <use href="#c0" transform="rotate(240 256 256)"/>
      <use href="#c0" transform="rotate(280 256 256)"/>
      <use href="#c0" transform="rotate(320 256 256)"/>
    </g>
    </g>
    <text x="42" y="350" font-size="17" font-weight="700" fill="#f3a52c">1. Gate ring</text>
    <text x="42" y="374" font-size="13.5" fill="#9aa7b6">Nine chevrons on a brushed band,</text>
    <text x="42" y="393" font-size="13.5" fill="#9aa7b6">thirty-six glyph ticks. Reads as</text>
    <text x="42" y="412" font-size="13.5" fill="#9aa7b6">a Stargate at a glance.</text>

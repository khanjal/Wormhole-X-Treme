    <text x="42" y="76" font-size="15" fill="#8b98a8">One mark, built up in four layers. Each layer is one of the things the plugin does.</text>
    <rect x="42" y="96" width="220" height="220" rx="14" fill="#0b111b" stroke="#222e3d"/>

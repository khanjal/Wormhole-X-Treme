<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 560" width="1144" height="560" role="img" aria-label="Wormhole X-Treme logo anatomy">
  <title>Wormhole X-Treme logo anatomy</title>
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="space" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#141d2b"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="metal" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b6c1cd"/>
      <stop offset="30%" stop-color="#7d8895"/>
      <stop offset="55%" stop-color="#4a545f"/>
      <stop offset="80%" stop-color="#68737f"/>
      <stop offset="100%" stop-color="#9aa5b1"/>
    </linearGradient>
    <linearGradient id="chevron" x1="0" y1="0" x2="0" y2="1">

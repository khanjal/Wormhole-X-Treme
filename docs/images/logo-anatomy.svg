    <text x="882" y="350" font-size="17" font-weight="700" fill="#f3a52c">4. Transport rings</text>
    <text x="882" y="374" font-size="13.5" fill="#9aa7b6">Four identical rings a block</text>
    <text x="882" y="393" font-size="13.5" fill="#9aa7b6">apart, in the stone grey the</text>
    <text x="882" y="412" font-size="13.5" fill="#9aa7b6">plugin actually draws them.</text>
    <text x="42" y="466" font-size="15" font-weight="700" fill="#eef3f9">Palette</text>

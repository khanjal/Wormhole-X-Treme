<text x="10.0" y="18.0" font-family="sans-serif" font-size="9.0" fill="#e6edf3" text-anchor="start">The finished stack &#8212; 4 blocks of headroom</text><rect x="10.2" y="138.2" width="31.5" height="15.5" fill="#1a2130"/><rect x="10.2" y="122.2" width="31.5" height="15.5" fill="#9aa3ad" stroke="#0b0f1655" stroke-width="0.5"/><text x="50.0" y="135.0" font-family="sans-serif" font-size="7.5" fill="#8ea0b8" text-anchor="start">ring 3 &#8212; 0.5 blocks up</text><rect x="10.2" y="106.2" width="31.5" height="15.5" fill="#1a2130"/><rect x="10.2" y="90.2" width="31.5" height="15.5" fill="#9aa3ad" stroke="#0b0f1655" stroke-width="0.5"/><text x="50.0" y="103.0" font-family="sans-serif" font-size="7.5" fill="#8ea0b8" text-anchor="start">ring 2 &#8212; 1.5 blocks up</text><rect x="10.2" y="74.2" width="31.5" height="15.5" fill="#1a2130"/><rect x="10.2" y="58.2" width="31.5" height="15.5" fill="#9aa3ad" stroke="#0b0f1655" stroke-width="0.5"/><text x="50.0" y="71.0" font-family="sans-serif" font-size="7.5" fill="#8ea0b8" text-anchor="start">ring 1 &#8212; 2.5 blocks up</text><rect x="10.2" y="42.2" width="31.5" height="15.5" fill="#1a2130"/><rect x="10.2" y="26.2" width="31.5" height="15.5" fill="#9aa3ad" stroke="#0b0f1655" stroke-width="0.5"/><text x="50.0" y="39.0" font-family="sans-serif" font-size="7.5" fill="#8ea0b8" text-anchor="start">ring 0 &#8212; 3.5 blocks up</text><rect x="10.0" y="154.0" width="232.0" height="7" fill="#3a3026"/><rect x="10.2" y="154.2" width="31.5" height="6.5" fill="#6b5a2a" stroke="#0b0f1655" stroke-width="0.5"/><text x="10.0" y="172.0" font-family="sans-serif" font-size="7.5" fill="#8ea0b8" text-anchor="start">The pad, and the half block the lowest ring hangs clear of it.</text><rect x="172.0" y="96.4" width="11" height="57.6" rx="5.5" fill="#5c6b7f"/><text x="177.5" y="92.4" font-family="sans-serif" font-size="7.0" fill="#8ea0b8" text-anchor="middle">1.8</text>

help.group.mirrors: "QR mirrors:"
help.group.settings: "QR settings:"
help.group.other: "QR other:"
help.gate.job.building: "QR building:"
help.gate.job.using: "QR using:"
help.gate.job.looking-after: "QR looking after:"
help.gate.job.shapes: "QR shapes:"
gate.cmd.separator: " / "

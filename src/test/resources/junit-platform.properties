# Lets GateStateGuard register itself for every test class through META-INF/services, so the
# check for leftover gate state cannot be forgotten the way an @AfterEach can.
#
# This switch is global, not per-extension: it enables every Extension any jar on the test
# classpath registers the same way. Nothing else on this one does -- mockito-junit-jupiter in
# particular does not, so MockitoExtension is still only where a class asks for it.
junit.jupiter.extensions.autodetection.enabled=true

# Wormhole X-Treme - example config.yml
# This sample highlights permission-related settings added in recent releases.

# If true, the plugin will not attempt to attach to any external permission
# provider (Vault/LuckPerms) even if one is available. Setting this to true
# forces the plugin to operate in a conservative mode where advanced actions
# require operator status.
permissions-support-disable: false

# If true (default), and no Vault-compatible permission provider is detected
# at server startup, the plugin will automatically enable a simple permission
# fallback mode so that basic use/dial actions continue to work. Advanced
# actions remain restricted to operators or gate owners. Set this to false to
# disable the automatic fallback.
permissions-auto-fallback: true

# Whether a redstone signal on a gate that is already open pushes its shutdown back, instead
# of doing nothing. Never past max_open_seconds, which is measured from when the wormhole
# first opened and is not affected by this -- so a cart crossing a detector rail can hold a
# gate open while traffic is flowing, but cannot hold it open indefinitely.
redstone-extend-open-time: true

# Sign styling. The plugin writes two signs: the gate's name sign (the `:N` block on the
# frame) and the dial sign a player puts on the `[D]` block. These control how it writes
# them. Colours are Bukkit colour names -- AQUA, GRAY, DARK_GRAY, GREEN, GOLD and so on.
# Anything unrecognised, or a formatting code that is not a colour such as MAGIC, falls
# back to the default rather than putting a stray code on a sign.
#
# The selected destination on a dial sign is also wrapped in >> << markers, so it still
# reads as the chosen one with colours turned off or for a colourblind player.

# Whether a player-placed dial sign is converted to the gate's own sign material, so a
# themed gate does not end up with an oak dial sign on a crimson frame. The sign's text and
# which way it faces are kept across the swap. Set false to leave whatever sign a player put
# up exactly as they placed it.
sign-dial-match-material: true

# Whether the plugin's own sign text glows. Glow draws a bright outline around every
# character, which on top of an already-coloured line reads as a halo and is harder to read,
# not easier -- so this is off and the colours below carry the emphasis instead. Set true if
# you want signs legible from further away in a dark gate room and can live with that.
sign-glowing-text: false

# A gate's own name, on both its name sign and its dial sign.
sign-color-gate-name: DARK_AQUA

# The network line on a gate's name sign.
sign-color-network: GRAY

# The owner line on a gate's name sign.
sign-color-owner: GRAY

# The destination currently selected on a dial sign. Worth keeping clearly distinct from
# the neighbour colour below -- telling those apart at a glance is what the dial sign is for.
sign-color-selected: DARK_GREEN

# The destinations either side of the selected one on a dial sign.
sign-color-neighbour: GRAY

# Material groups define the palettes a stargate can be built from. The first group
# listed is the default. A gate's palette is identified by the material of its frame,
# so each group must use a different `structure` material — build the same shape in
# obsidian and you get a Standard gate, in lapis an Atlantis one.
#
# Geometry lives in the .shape files and is completely independent of these palettes:
# any shape can be built in any group, so adding a palette here does not need a new
# .shape file. A shape may opt out by listing `MATERIAL_GROUPS=Standard,Atlantis`.
#
# structure: the frame. Identifies the group, so it must be unique.
# portal:    what the interior shows while a wormhole is open.
# iris:      what the iris is made of when engaged (a real, solid block).
# light:     what the light blocks become while the gate is active.
# sign:      wall-sign type used for the gate's name sign. Any *_WALL_SIGN material.
gate-material-groups:
  Standard:
    structure: OBSIDIAN
    portal: WATER
    iris: STONE
    light: GLOWSTONE
    sign: OAK_WALL_SIGN
  Atlantis:
    structure: LAPIS_BLOCK
    portal: WATER
    iris: YELLOW_STAINED_GLASS
    light: SEA_LANTERN
    sign: WARPED_WALL_SIGN
  Universe:
    structure: POLISHED_BLACKSTONE
    portal: WATER
    iris: WHITE_STAINED_GLASS
    light: SEA_LANTERN
    sign: CRIMSON_WALL_SIGN
  MilkyWay:
    structure: DEEPSLATE
    portal: WATER
    iris: IRON_BLOCK
    light: SHROOMLIGHT
    sign: OAK_WALL_SIGN

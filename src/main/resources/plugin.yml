name: WormholeXTreme
main: com.wormhole_xtreme.wormhole.WormholeXTreme
version: 0.854
api-version: "1.20"
authors: [Lologarithm, alron]
softdepend: [Permissions, Vault, LuckPerms, WormholeXTremeWorlds]
description: >
             Wormhole X-Treme! Wormholes as travel portals. Splash Effect, IDC,
             Iris, configurable Wormhole materials, and much much more.
             
commands:
   dial:
     description: Dial a remote Stargate, unlock IDC with optional password 
     usage: |
            /<command> <StarGate> [IDC]
            <stargate> The StarGate to dial.
            [IDC] Use optional password to open remote Iris.
                     
            
   wormhole:
     description: Wormhole administration and configuration commands (canonical admin command).
     aliases: [wx]
     usage: |
            /<command> <commandtype> [ARG1] [ARG2]
            Valid Commandtypes - owner, perms, portalmaterial, irismaterial, lightmaterial, shutdown_timeout, activate_timeout, simple, regenerate, redstone, and custom.

   # legacy wx* command entries (kept for compatibility with registerCommands)
   wxforce:
     description: Force a gate action (compat)
   wxidc:
     description: IDC management (compat)
   wxcompass:
     description: Compass helper (compat)
   wxcomplete:
     description: Complete gate construction (compat)
   wxremove:
     description: Remove a gate (compat)
   wxlist:
     description: List gates (compat)
   wxgo:
     description: Teleport to gate (compat)
   wxbuild:
     description: Build gate helper (compat)
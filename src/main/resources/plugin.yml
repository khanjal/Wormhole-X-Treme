name: WormholeXTreme
main: com.wormhole_xtreme.wormhole.WormholeXTreme
version: 1.0.0
api-version: "1.20"
authors: ["Lologarithm", "alron", "Khan Jal"]
softdepend: [Permissions, Vault, LuckPerms, WormholeXTremeWorlds]
description: >
  Wormhole X-Treme! Wormholes as travel portals. Splash Effect, IDC,
  Iris, configurable Wormhole materials, and much much more.

commands:
  dial:
    description: Dial a remote Stargate, unlock IDC with optional password
    usage: |
      /<command> <StarGate> [IDC]
      <stargate> The StarGate to dial.
      [IDC] Use optional password to open remote Iris.

  wormhole:
    description: Wormhole administration and configuration commands (canonical admin command).
    aliases: [wx]
    usage: |
      /<command> <subcommand> [args]
      Gates:    list, build, complete, remove, regenerate, refresh
      Travel:   go, compass, force
      Per gate: owner, idc, redstone, custom, portalmaterial, irismaterial, lightmaterial, wooshdepth
      Server:   perms, shutdown_timeout, activate_timeout, cooldown, restrict, storage
      Run /<command> with no arguments for the full list.

  # legacy wx* command entries removed; now provided as aliases under `wormhole`.

permissions:
  wormhole.use.sign:
    description: Allow using sign-based dialers and sign interactions.
    default: false
  wormhole.use.dialer:
    description: Allow using the dialer to initiate a gate dial.
    default: false
  wormhole.use.compass:
    description: Allow using the compass command to point to gates.
    default: false
  wormhole.remove.own:
    description: Allow removing gates you own.
    default: false
  wormhole.remove.all:
    description: Allow removing any gate (admin-level).
    default: op
  wormhole.build:
    description: Allow building gates using automation commands.
    default: op
  wormhole.config:
    description: Allow changing plugin configuration via command.
    default: op
  wormhole.list:
    description: Allow listing gates via command.
    default: false
  wormhole.go:
    description: Allow teleporting to gates via command.
    default: false
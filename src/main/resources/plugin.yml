name: WormholeXTreme
main: com.wormhole_xtreme.wormhole.WormholeXTreme
version: ${project.version}
api-version: "1.20"
authors: ["Lologarithm", "alron", "Khan Jal"]
softdepend: [Permissions, Vault, LuckPerms, WormholeXTremeWorlds]

description: >
  Wormhole X-Treme! Wormholes as travel portals. Splash Effect, IDC,
  Iris, configurable Wormhole materials, and much much more.

commands:
  dial:
    description: Dial a remote Stargate, unlock IDC with optional password
    usage: |
      /<command> <StarGate> [IDC]
      <stargate> The StarGate to dial.
      [IDC] Use optional password to open remote Iris.

  wormhole:
    description: Wormhole administration and configuration commands (canonical admin command).
    aliases: [wx]
    usage: |
      /<command> <subcommand> [args]
      Gates:  gate build|complete|list|remove|edit|regenerate|refresh|go|force
      Rings:  ring create|cancel|list|remove|edit|allow|deny|owner
      Config: config <setting> [value]
      Other:  compass
      The old flat names (portalmaterial, cooldown, and the rest) still work.
      Run /<command> with no arguments for the list.

  # legacy wx* command entries removed; now provided as aliases under `wormhole`.

permissions:
  wormhole.use.sign:
    description: Allow using sign-based dialers and sign interactions.
    default: false
  wormhole.use.dialer:
    description: Allow using the dialer to initiate a gate dial.
    default: false
  wormhole.use.compass:
    description: Allow using the compass command to point to gates.
    default: false
  wormhole.remove.own:
    description: Allow removing gates you own.
    default: false
  wormhole.remove.all:
    description: Allow removing any gate (admin-level).
    default: op
  wormhole.build:
    description: Allow building gates using automation commands.
    default: op
  wormhole.config:
    description: Allow changing plugin configuration via command.
    default: op
  wormhole.ring.build:
    description: Allow building and pairing transport rings.
    default: op
  wormhole.ring.use:
    description: Allow travelling by a transport ring you are permitted on.
    default: true
  wormhole.ring.admin:
    description: Allow using and managing any ring pair, whoever owns it.
    default: op
  wormhole.ring.unlimited:
    description: Allow owning more ring pairs than the configured quota.
    default: op
  wormhole.beam.use:
    description: Allow beaming to a public destination or one of your own places.
    default: true
  wormhole.beam.place:
    description: Allow creating and managing your own private beam places.
    default: true
  wormhole.beam.admin:
    description: Allow managing public beam destinations, and anyone's places.
    default: op
  wormhole.list:
    description: Allow listing gates via command.
    default: false
  wormhole.go:
    description: Allow teleporting to gates via command.
    default: false
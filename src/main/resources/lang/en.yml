# Wormhole X-Treme chat messages, in English.
#
# To translate, copy this file to lang/<code>.yml beside it, translate the text in quotes, and set
# language: <code> in config.yml. Keep each {0}, {1} and § colour code; a message left out is sent
# in English. Guide: docs/guide/TRANSLATING.md


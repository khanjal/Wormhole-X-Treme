name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"   # release workflow handles version tags

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn --batch-mode verify


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WormholeXTreme-snapshot
          path: target/WormholeXTreme-*.jar
          retention-days: 14

  # The shipped jar is built against the oldest supported server, which stops us calling
  # anything newer by accident. That says nothing about whether a newer server has since
  # removed something we rely on, so every supported version is built and tested here.
  # A Minecraft version is only claimed as supported in the README if it is in this list.
  server-api:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor. EntityDismountEvent only lives in org.spigotmc here, so the listener
          # for the newer package is excluded; the legacy one is what such a server loads.
          - minecraft: "1.20"
            api: "1.20-R0.1-SNAPSHOT"
            profile: "-Plegacy-api"
          - minecraft: "1.20.1"
            api: "1.20.1-R0.1-SNAPSHOT"
            profile: "-Plegacy-api"
          # The only version carrying both EntityDismountEvent packages, and so the one this
          # plugin compiles against.
          - minecraft: "1.20.4"
            api: "1.20.4-R0.1-SNAPSHOT"
            profile: ""
          - minecraft: "1.20.6"
            api: "1.20.6-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          - minecraft: "1.21.1"
            api: "1.21.1-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          # Boats split into one entity type per wood here, which removed EntityType.BOAT.
          - minecraft: "1.21.4"
            api: "1.21.4-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          # The newest published spigot-api.
          - minecraft: "1.21.10"
            api: "1.21.10-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test against Minecraft ${{ matrix.minecraft }}
        run: mvn --batch-mode verify ${{ matrix.profile }} -Dspigot.api.version=${{ matrix.api }}
  spotbugs:
    name: SpotBugs (Java 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run SpotBugs
        run: mvn --batch-mode -DskipTests=true spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 14

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # A pull request from a fork does not receive this repository's secrets, so SONAR_TOKEN
    # is empty there and the scan can only fail auth. Skip that case outright rather than
    # running it and swallowing the failure: a job that always passes because it never
    # analysed anything is indistinguishable at a glance from one that works, which is worse
    # than having no job at all. Anything that runs here is expected to succeed, so a failure
    # is a real one and is allowed to fail the build. That is about the analysis being
    # uploaded at all -- code quality itself is not blocking yet, since no quality gate is
    # waited on until there is a baseline worth judging against.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud's new-code and blame data need real history, not the single commit a
          # shallow checkout would give it.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The skip above covers the one case where the token is legitimately absent. If it is
      # missing anywhere else the secret has been removed or has expired, and saying so here
      # is clearer than the scanner's auth error several minutes into a build.
      - name: Check the Sonar token is present
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build, test, and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=khanjal_Wormhole-X-Treme
          -Dsonar.organization=ironraptor
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

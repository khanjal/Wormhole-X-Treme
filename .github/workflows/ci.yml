name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"   # release workflow handles version tags

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn --batch-mode verify


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WormholeXTreme-snapshot
          path: target/WormholeXTreme-*.jar
          retention-days: 14

  # The shipped jar is built against the oldest supported server, which stops us calling
  # anything newer by accident. That says nothing about whether a newer server has since
  # removed something we rely on, so every supported version is built and tested here.
  # A Minecraft version is only claimed as supported in the README if it is in this list.
  server-api:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor. Below this, EntityDismountEvent lives in a different package.
          - minecraft: "1.20.4"
            api: "1.20.4-R0.1-SNAPSHOT"
          - minecraft: "1.20.6"
            api: "1.20.6-R0.1-SNAPSHOT"
          - minecraft: "1.21.1"
            api: "1.21.1-R0.1-SNAPSHOT"
          # Boats split into one entity type per wood here, which removed EntityType.BOAT.
          - minecraft: "1.21.4"
            api: "1.21.4-R0.1-SNAPSHOT"
          # The newest published spigot-api.
          - minecraft: "1.21.10"
            api: "1.21.10-R0.1-SNAPSHOT"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test against Minecraft ${{ matrix.minecraft }}
        run: mvn --batch-mode verify -Dspigot.api.version=${{ matrix.api }}
  spotbugs:
    name: SpotBugs (Java 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run SpotBugs
        run: mvn --batch-mode -DskipTests=true spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 14

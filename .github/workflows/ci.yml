name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main
      - master
    tags-ignore:
      - "v*"   # release workflow handles version tags

# A newer push to the same pull request makes the run in progress moot, so it is cancelled.
# Anything else gets a group of its own per run: a shared group would queue main's commits and
# drop all but the newest pending one.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No 21 here: "Minecraft 1.20.4" below is the same build, the default API on Java 21.
        java: ["17", "25"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn --batch-mode verify

      # Reports only when there is a failure to read them for; a passing run's results are in the log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          # A build that failed before the tests ran has no reports to upload.
          if-no-files-found: ignore
          retention-days: 7

      # One jar a run: every JDK here builds the same Java 17 bytecode.
      - name: Upload JAR artifact
        if: success() && matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: WormholeXTreme-snapshot
          path: target/WormholeXTreme-*.jar
          retention-days: 7

  # The shipped jar is built against the oldest supported server, which stops us calling
  # anything newer by accident. That says nothing about whether a newer server has since
  # removed something we rely on, so every supported version is built and tested here.
  # A Minecraft version is only claimed as supported in the README if it is in this list.
  server-api:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor. EntityDismountEvent only lives in org.spigotmc here, so the listener
          # for the newer package is excluded; the legacy one is what such a server loads.
          - minecraft: "1.20"
            api: "1.20-R0.1-SNAPSHOT"
            profile: "-Plegacy-api"
          - minecraft: "1.20.1"
            api: "1.20.1-R0.1-SNAPSHOT"
            profile: "-Plegacy-api"
          # The only version carrying both EntityDismountEvent packages, and so the one this
          # plugin compiles against.
          - minecraft: "1.20.4"
            api: "1.20.4-R0.1-SNAPSHOT"
            profile: ""
          - minecraft: "1.20.6"
            api: "1.20.6-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          - minecraft: "1.21.1"
            api: "1.21.1-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          # Boats split into one entity type per wood here, which removed EntityType.BOAT.
          - minecraft: "1.21.4"
            api: "1.21.4-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          - minecraft: "1.21.10"
            api: "1.21.10-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          # The last 1.x. Its API went to R0.2 within the version.
          - minecraft: "1.21.11"
            api: "1.21.11-R0.2-SNAPSHOT"
            profile: "-Pmodern-api"
          # Minecraft's year-based numbering from here. The API is still Java 17 bytecode; the
          # server itself needs Java 25.
          - minecraft: "26.1.2"
            api: "26.1.2-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
          # The newest stable release. Adds the SULFUR_CAVES biome.
          - minecraft: "26.2"
            api: "26.2-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test against Minecraft ${{ matrix.minecraft }}
        run: mvn --batch-mode verify ${{ matrix.profile }} -Dspigot.api.version=${{ matrix.api }}

  # The same plugin built against paper-api instead. Paper-only methods are reached reflectively,
  # so a wrong name would silently turn the feature off; PaperApiTest only runs here.
  paper-api:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "paper:", not "minecraft:": release.yml reads every "- minecraft:" line as a
        # supported version for the release title.
        include:
          - paper: "1.20.4"
            api: "1.20.4-R0.1-SNAPSHOT"
            profile: ""
            java: "21"
          - paper: "1.21.11"
            api: "1.21.11-R0.1-SNAPSHOT"
            profile: "-Pmodern-api"
            java: "21"
          # The newest stable build.
          - paper: "26.2"
            api: "26.2.build.124-stable"
            profile: "-Pmodern-api"
            java: "25"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Build and test against Paper ${{ matrix.paper }}
        run: mvn --batch-mode verify ${{ matrix.profile }} -Dpaper.api.version=${{ matrix.api }}
  spotbugs:
    name: SpotBugs (Java 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Run SpotBugs
        run: mvn --batch-mode -DskipTests=true spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          # spotbugs:check writes no report when it finds nothing to report.
          if-no-files-found: ignore
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # A pull request from a fork does not receive this repository's secrets, so SONAR_TOKEN
    # is empty there and the scan can only fail auth. Skip that case outright rather than
    # running it and swallowing the failure: a job that always passes because it never
    # analysed anything is indistinguishable at a glance from one that works, which is worse
    # than having no job at all. Anything that runs here is expected to succeed, so a failure
    # is a real one and is allowed to fail the build. On a pull request, so does any open
    # Sonar finding; see the last step.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud's new-code and blame data need real history, not the single commit a
          # shallow checkout would give it.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The skip above covers the one case where the token is legitimately absent. If it is
      # missing anywhere else the secret has been removed or has expired, and saying so here
      # is clearer than the scanner's auth error several minutes into a build.
      - name: Check the Sonar token is present
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build, test, and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn --batch-mode verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=khanjal_Wormhole-X-Treme
          -Dsonar.organization=ironraptor
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # A pull request fails while it has any open Sonar finding. The quality gate only weighs
      # coverage, which most pull requests miss, so its red went unread and 1.6.0 left 41
      # findings behind (#311). Main's older findings are not counted: only the pull request's.
      - name: Fail on new Sonar findings
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The scan is processed after upload; its findings are not there to read until it is done.
          task_url=$(sed -n 's/^ceTaskUrl=//p' target/sonar/report-task.txt 2>/dev/null)
          if [ -z "$task_url" ]; then
            echo "::error::No ceTaskUrl in target/sonar/report-task.txt; the scanner's report is missing or has changed format"
            exit 1
          fi
          status=PENDING
          for attempt in $(seq 1 60); do
            status=$(curl -sf -u "$SONAR_TOKEN:" "$task_url" | jq -r .task.status)
            case "$status" in
              SUCCESS) break ;;
              FAILED|CANCELED) echo "::error::SonarCloud analysis $status"; exit 1 ;;
            esac
            sleep 5
          done
          if [ "$status" != SUCCESS ]; then
            echo "::error::SonarCloud analysis did not finish in five minutes"
            exit 1
          fi
          issues=$(curl -sf -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=khanjal_Wormhole-X-Treme&pullRequest=$PR&resolved=false&ps=100")
          # Workflow commands need %, CR and LF escaped, and : and , as well inside a property.
          echo "$issues" | jq -r '
            def data: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: data | gsub(":"; "%3A") | gsub(","; "%2C");
            .issues[] | "::error file=\(.component | sub("^[^:]*:"; "") | prop),line=\(.line // 1),title=\("Sonar " + .rule | prop)::\(.message | data)"'
          total=$(echo "$issues" | jq .total)
          if [ "$total" -gt 0 ]; then
            echo "::error::$total open Sonar finding(s) on this pull request. Fix them before merging."
            exit 1
          fi
          echo "No open Sonar findings on this pull request."

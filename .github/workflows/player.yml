name: Player journeys

# A bot joins a real Paper server as a player and travels by gate, beam and ring; see
# scripts/player-boot.sh. Run by hand from the Actions tab, and whenever the harness itself changes.
# Not on every pull request yet: it is new, and a flaky bot there would cost more than it catches.
#
# The lab (scripts/run-lab.js) is for a person, not a check, but it shares the bot's code; its
# self-test, which has the bot work every panel as a watcher would, runs here when either changes,
# so neither can break the other unseen.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/player-boot.sh
      - scripts/player-test/**
      - scripts/boot-test.sh
      - scripts/run-lab.js
      - .github/workflows/player.yml

permissions:
  contents: read

jobs:
  journeys:
    name: Player on paper ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The versions boot-travel runs that Mineflayer can speak; it has no 26.2 or 26.3 yet.
        version: ["1.20.4", "1.21.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build the plugin
        run: mvn --batch-mode -DskipTests package

      - name: Fetch paper ${{ matrix.version }}
        run: bash scripts/fetch-server.sh paper ${{ matrix.version }} server.jar

      - name: Travel as a player
        env:
          BOOT_DIR: boot
        run: bash scripts/player-boot.sh server.jar target/WormholeXTreme.jar ${{ matrix.version }}

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-log-${{ matrix.version }}
          path: boot/console.log
          if-no-files-found: ignore
          retention-days: 7

  lab:
    name: Lab self-test on paper ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest the journeys run, and 26.1.2, the lab's default: the newest
        # Mineflayer speaks. Signs and books changed format at 1.21.5, so both sides are covered.
        include:
          - version: "1.20.4"
            java: "21"
          - version: "1.21.11"
            java: "21"
          - version: "26.1.2"
            java: "25"

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: Build the plugin
        run: mvn --batch-mode -DskipTests package

      - name: Fetch paper ${{ matrix.version }}
        run: bash scripts/fetch-server.sh paper ${{ matrix.version }} server.jar

      # run-lab.js asks for Node 22, the oldest the bot is known to run on.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Work every panel in the lab
        run: node scripts/run-lab.js ${{ matrix.version }} --server server.jar --plugin target/WormholeXTreme.jar --selftest

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-log-${{ matrix.version }}
          path: .local-server/lab-${{ matrix.version }}/console.log
          if-no-files-found: ignore
          retention-days: 7

name: Claude Triage Sweep

# A preliminary look at issues labelled needs-investigation: what the issue is, which files it
# probably touches, what the report is missing, whether it duplicates an older one. Advisory
# only -- it comments and swaps the label, and cannot close an issue or write to the tree.
#
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, one year) and
# the needs-investigation / triaged labels. Setup notes: .github/TRIAGE.md.

on:
  schedule:
    # Daily rather than hourly: this repository's issue volume does not justify more, and the
    # queue is drained oldest-first so nothing waits longer than a day per batch.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      max_issues:
        description: "How many issues to investigate in this run"
        type: number
        default: 3

# Two sweeps draining the same queue would comment on the same issue twice.
concurrency:
  group: claude-triage-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Investigate queued issues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Only the skill and the tree it searches are needed; no history.
          fetch-depth: 1

      # A daily cron over an empty queue should cost a few seconds of runner, not a Claude run.
      - name: Count the queue
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --label needs-investigation --json number --jq 'length')
          echo "Issues awaiting investigation: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The token is checked here rather than left to fail inside the action, where an expired
      # OAuth token surfaces as an authentication error several steps in.
      - name: Check the Claude token is present
        if: steps.queue.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Investigate
        if: steps.queue.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        env:
          # The sweep drives the `gh` CLI, which reads this.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Passing a token means the Claude GitHub App does not have to be installed; comments
          # then arrive from github-actions[bot], which is honest about what wrote them.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # github.event.inputs rather than the inputs context: the latter is documented as
          # available only on workflow_dispatch and workflow_call, and this step also runs on
          # a schedule, where the property lookup safely yields nothing and the default stands.
          prompt: "/triage-sweep REPO: ${{ github.repository }} MAX_ISSUES: ${{ github.event.inputs.max_issues || '3' }}"
          # Issue bodies are untrusted text going into an agent, so the tool list is the real
          # containment: read-only over the tree, and only the three gh subcommands the sweep
          # needs. The label swap goes through a script that can touch nothing else.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(.github/scripts/triage-label.sh:*),Read,Grep,Glob"

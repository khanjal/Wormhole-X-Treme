name: Release

on:
  push:
    tags:
      - "v*.*.*"   # triggers on tags like v1.0.0, v0.855, v1.2.3-beta

  # A rehearsal, so this file is not first run in anger on the day of a release. It builds
  # exactly what a tag would and uploads the jar to look at, but publishes nothing: the three
  # steps below that only make sense for a real tag are all skipped.
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so git describe works

      # Both of these read the tag, so both are for a real release only. A manual run has no
      # tag to read -- GITHUB_REF_NAME would be the branch -- and keeps whatever version the
      # pom already carries, which is what makes the rehearsal build a sensibly named jar.
      - name: Parse version from tag
        id: version
        if: github.event_name == 'push'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set Maven project version
        if: github.event_name == 'push'
        run: mvn --batch-mode versions:set -DnewVersion="${{ steps.version.outputs.VERSION }}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn --batch-mode verify

      - name: Locate JAR
        id: jar
        run: |
          JAR=$(ls target/WormholeXTreme-*.jar | grep -v original | head -1)
          echo "JAR=$JAR" >> "$GITHUB_OUTPUT"
          echo "JAR_NAME=$(basename $JAR)" >> "$GITHUB_OUTPUT"

      - name: Read the supported Minecraft range from the CI matrix
        id: mc
        run: |
          # The range comes from the versions CI actually builds against, not from
          # api-version. api-version is only the floor - a server older than that refuses to
          # load the plugin at all - so titling a release with it undersold every version
          # above the floor that is equally supported.
          #
          # Reading the matrix means the title follows whatever CI proves, and adding a
          # version there is enough to keep it right. The matrix is kept in ascending order
          # for exactly this reason.
          # [^"]* rather than .*, and a trailing .* to consume the rest of the line: the
          # greedy form left anything after the closing quote in place, so an inline comment
          # on a matrix entry would end up inside the version.
          VERSIONS=$(sed -n 's/^ *- minecraft: "\([^"]*\)".*/\1/p' .github/workflows/ci.yml)
          MIN=$(echo "$VERSIONS" | head -1)
          MAX=$(echo "$VERSIONS" | tail -1)
          if [ -z "$MIN" ] || [ -z "$MAX" ]; then
            echo "Could not read the Minecraft matrix from ci.yml" >&2
            exit 1
          fi
          if [ "$MIN" = "$MAX" ]; then
            echo "MC=$MIN" >> "$GITHUB_OUTPUT"
          else
            echo "MC=$MIN-$MAX" >> "$GITHUB_OUTPUT"
          fi

      # The one step a rehearsal cannot exercise, because exercising it would publish. It is
      # skipped rather than made conditional on a draft, since a workflow that sometimes
      # publishes from a button is a worse hazard than an unproven step.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          # The Minecraft version is the axis that matters. Server flavour is not: the
          # plugin uses only the Bukkit API, so one jar serves CraftBukkit, Spigot, Paper,
          # Purpur and Pufferfish.
          name: "Wormhole X-Treme ${{ github.ref_name }} (MC ${{ steps.mc.outputs.MC }})"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.jar.outputs.JAR }}

      # So a rehearsal produces something to look at rather than only a green tick.
      - name: Upload the jar a real release would have attached
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-${{ steps.jar.outputs.JAR_NAME }}
          path: ${{ steps.jar.outputs.JAR }}
          if-no-files-found: error

name: Feature request
description: Suggest something the plugin should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe the situation rather than the solution — knowing
        what you were trying to build often turns up a simpler answer than the one being
        asked for.

  - type: dropdown
    id: area
    attributes:
      label: What would this affect
      options:
        - Gates
        - Transport rings
        - Commands or config
        - Something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The thing you were building or running when you wanted this. What is awkward about
        doing it today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like
      description: How you picture it working. A command, a setting, a behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
      description: >
        Workarounds, other plugins, or a config you have bent into shape. Useful even when
        they did not work — it says where the edges are.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and requests
          required: true
